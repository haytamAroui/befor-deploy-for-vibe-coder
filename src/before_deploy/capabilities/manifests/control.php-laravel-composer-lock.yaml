schema_version: 1
id: control.native.php-laravel-composer-lock
version: "0.1.0"
implementation_id: SEC-PHP-LARAVEL-COMPOSER-LOCK-001
kind: CONTROL
title: Laravel root Composer lockfile presence check
applies_when:
  languages:
    - PHP
  frameworks:
    - Laravel
security_domains:
  - DOMAIN-SUPPLY-CHAIN-001
exclusions:
  - Only an inventory-included root composer.json JSON object with a direct require object containing the exact laravel/framework key and an inventory-included root artisan file is considered.
  - Root composer.lock presence is the only positive evidence; its contents, integrity, freshness, dependency resolution, and relationship to composer.json are not inspected.
  - Composer values and constraints, require-dev, transitive dependencies, repositories, signatures, hashes, vulnerabilities, nested projects, monorepos, symlinks, PHP extensions, Laravel configuration, runtime behavior, and target command execution are excluded.
