schema_version: 1
id: control.native.fastapi-api
version: "0.2.0"
implementation_id: SEC-API-001
kind: CONTROL
title: FastAPI static mutating-route declaration and dynamic-route review check
applies_when:
  frameworks:
    - FastAPI
security_domains:
  - API security
  - "Framework: FastAPI"
exclusions:
  - Declared dependencies do not prove effective authorization.
  - Dynamic route paths or api_route methods produce a structural review state only; they are not security findings and do not alter the policy decision.
  - Route path values, computed methods, runtime route registration, decorator aliases, and authorization semantics are not inferred.
