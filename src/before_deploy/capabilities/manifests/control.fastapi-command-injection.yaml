schema_version: 1
id: control.native.fastapi-direct-command-injection
version: "0.1.0"
implementation_id: SEC-FASTAPI-COMMAND-INJECTION-001
kind: CONTROL
title: FastAPI direct request-to-shell command injection check
applies_when:
  languages:
    - Python
  frameworks:
    - FastAPI
security_domains:
  - Injection protection
exclusions:
  - Only literal FastAPI routes with bare string request parameters and direct os.system or subprocess run, call, or Popen shell sinks are inspected.
  - Aliases, f-strings, concatenation, local aliases, transformations, wrappers, helpers, interprocedural flow, dynamic shell flags, list-form subprocess calls, and runtime reachability are not inferred.
