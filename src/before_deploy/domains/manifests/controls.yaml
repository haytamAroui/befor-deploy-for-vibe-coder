schema_version: 1
controls:
  - id: CONTROL-SECRETS-NATIVE-001
    version: "0.1.0"
    title: Native source secret pattern detection
    capability_id: control.native.secrets
    implementation_id: SEC-SECRET-001
    security_domains:
      - DOMAIN-SECRETS-001
    detection_scope: Redaction-safe detection of bounded source-visible secret patterns.
    exclusions:
      - Entropy analysis, git history, runtime secret stores, and secret validity are not covered.
    references:
      - REF-OWASP-CICD
  - id: CONTROL-SECRETS-GITLEAKS-001
    version: "0.1.0"
    title: Gitleaks directory scan adapter
    capability_id: adapter.gitleaks-directory
    implementation_id: SEC-SECRET-GITLEAKS-001
    security_domains:
      - DOMAIN-SECRETS-001
    detection_scope: Policy-configured isolated Gitleaks directory scan with normalized redacted findings.
    exclusions:
      - This adapter is opt-in and git-history scanning is not enabled by this contract.
    references:
      - REF-OWASP-CICD
  - id: CONTROL-INJECTION-PYTHON-001
    version: "0.2.0"
    title: Python SQL interpolation and local-flow detection
    capability_id: control.native.python-sast
    implementation_id: SEC-SAST-001
    security_domains:
      - DOMAIN-INJECTION-001
    detection_scope: Python AST detection of direct f-string, percent, or format interpolation passed to execute calls, plus one local straight-line name assignment to a standalone execute or executemany call in the same lexical scope.
    exclusions:
      - Branches, loops, try/with blocks, calls, imports, attributes, aliases, closures, globals, interprocedural dataflow, ORMs, runtime values, other injection families, and non-Python code are not covered.
    references: []
  - id: CONTROL-INJECTION-SEMGREP-001
    version: "0.1.0"
    title: Semgrep local Python rule adapter
    capability_id: adapter.semgrep-python-local
    implementation_id: SEC-SAST-SEMGREP-001
    security_domains:
      - DOMAIN-INJECTION-001
    detection_scope: Policy-configured isolated Semgrep execution using the reviewed local Python rule pack.
    exclusions:
      - This adapter is opt-in and remote registries, metrics, autofix, and local builds are disabled.
    references: []
  - id: CONTROL-API-FASTAPI-001
    version: "0.3.0"
    title: FastAPI static mutating-route declaration and dynamic-route review check
    capability_id: control.native.fastapi-api
    implementation_id: SEC-API-001
    security_domains:
      - DOMAIN-API-SECURITY-001
    detection_scope: Python AST check for visible authentication dependencies on supported static mutating FastAPI routes, plus a structural review state for dynamic route paths, api_route methods, or direct top-level APIRouter prefix expressions.
    exclusions:
      - Dependency presence is not proof of authorization correctness or runtime enforcement.
      - Dynamic route review states are not findings and do not change a policy decision.
      - Route path values, computed methods, APIRouter aliases/factories/registrations, prefix values, runtime registration, decorator aliases, business authorization, object-level access, and runtime middleware are not inferred.
    references:
      - REF-OWASP-API-2023
  - id: CONTROL-API-FASTAPI-INPUT-001
    version: "0.1.0"
    title: FastAPI direct untyped mutating-body input check
    capability_id: control.native.fastapi-input-validation
    implementation_id: SEC-API-INPUT-001
    security_domains:
      - DOMAIN-INPUT-VALIDATION-001
      - DOMAIN-API-SECURITY-001
    detection_scope: Python AST check for bare dict or Any annotations on direct function parameters of literal mutating FastAPI route decorators.
    exclusions:
      - Bare annotations do not prove effective body binding or absence of runtime validation.
      - Generic aliases, model aliases, dynamic annotations, inferred body sources, decorator aliases, factories, indirect parameters, and non-literal paths are not inferred.
      - Schema semantics, normalization, size limits, business constraints, interprocedural flow, and runtime behavior are not covered.
    references:
      - REF-OWASP-API-2023
  - id: CONTROL-API-FASTAPI-UPLOAD-001
    version: "0.1.0"
    title: FastAPI direct upload filename filesystem sink check
    capability_id: control.native.fastapi-file-upload
    implementation_id: SEC-API-UPLOAD-001
    security_domains:
      - DOMAIN-FILE-UPLOAD-001
      - DOMAIN-PATH-TRAVERSAL-001
    detection_scope: Python AST check for a direct UploadFile annotation whose filename attribute is passed directly to the built-in open call inside a literal mutating FastAPI route.
    exclusions:
      - A direct filename sink is a bounded lexical signal and does not prove path traversal, upload binding, or runtime reachability.
      - Sanitization, path resolution, aliases, helper calls, storage APIs, archive handling, MIME validation, size limits, malware scanning, authorization, and runtime behavior are not inferred.
      - Dynamic decorators, decorator aliases, route factories, indirect parameters, non-literal paths, and non-FastAPI decorators are excluded.
    references:
      - REF-OWASP-API-2023
  - id: CONTROL-CONFIG-PYTHON-DEBUG-001
    version: "0.1.0"
    title: Python debug configuration check
    capability_id: control.native.python-debug-config
    implementation_id: SEC-CONFIG-001
    security_domains:
      - DOMAIN-PRODUCTION-CONFIGURATION-001
    detection_scope: Static supported Python and configuration evidence of debug enabled.
    exclusions:
      - Deployed environment values and runtime configuration precedence are not covered.
    references: []
  - id: CONTROL-CORS-PYTHON-001
    version: "0.1.0"
    title: Python credentialed wildcard CORS check
    capability_id: control.native.python-cors
    implementation_id: SEC-CONFIG-002
    security_domains:
      - DOMAIN-CORS-001
    detection_scope: Static supported Python and configuration evidence of credentialed wildcard CORS.
    exclusions:
      - Proxies, CDNs, dynamic origin handling, and runtime middleware are not covered.
    references: []
  - id: CONTROL-CICD-GITHUB-ACTIONS-001
    version: "0.1.0"
    title: GitHub Actions workflow hardening check
    capability_id: control.native.github-actions
    implementation_id: SEC-CICD-001
    security_domains:
      - DOMAIN-CICD-SECURITY-001
    detection_scope: Static workflow checks for privileged checkout, write-all permissions, and non-full-SHA action pins.
    exclusions:
      - Repository settings, runner isolation, secrets, and workflow behavior are not covered.
    references:
      - REF-OWASP-CICD
  - id: CONTROL-CONTAINER-DOCKER-COMPOSE-PRIVILEGED-001
    version: "0.1.0"
    title: Direct Docker Compose privileged service configuration check
    capability_id: control.native.docker-compose-privileged
    implementation_id: SEC-COMPOSE-PRIVILEGED-001
    security_domains:
      - DOMAIN-CONTAINER-SECURITY-001
    detection_scope: Root compose.yaml, compose.yml, docker-compose.yaml, or docker-compose.yml single-document YAML mapping with a direct services mapping, direct service mapping, and unquoted lowercase boolean privileged true scalar.
    exclusions:
      - Anchors, aliases, merge keys, interpolation, templates, include, extends, profiles, quoted or alternative boolean values, nested projects, Kubernetes, Helm, CloudFormation, Terraform, Dockerfiles, images, commands, secrets, host policy, runtime behavior, and Docker or Compose execution are not covered.
      - A finding records only constant artifact and issue evidence, the relative file path, and value line; service names, images, YAML content, and parser output are not retained.
    references: []
  - id: CONTROL-SUPPLY-DEPENDENCY-MANIFEST-001
    version: "0.1.0"
    title: Dependency manifest and lockfile presence check
    capability_id: control.native.dependency-manifest
    implementation_id: SEC-DEP-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Presence checks for supported ecosystem manifests and lockfiles.
    exclusions:
      - Vulnerability analysis, integrity validation, and unsupported package ecosystems are not covered.
    references:
      - REF-OWASP-CICD
  - id: CONTROL-SUPPLY-PHP-LARAVEL-COMPOSER-LOCK-001
    version: "0.1.0"
    title: Laravel root Composer lockfile presence check
    capability_id: control.native.php-laravel-composer-lock
    implementation_id: SEC-PHP-LARAVEL-COMPOSER-LOCK-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Root composer.json JSON require object containing the exact laravel/framework key plus root artisan file, checked only for root composer.lock presence.
    exclusions:
      - Composer values and constraints, require-dev, transitive dependencies, repositories, signatures, hashes, vulnerabilities, nested projects, monorepos, symlinks, PHP extensions, Laravel configuration, runtime behavior, and target command execution are not covered.
      - composer.lock presence is evidence only; its contents, integrity, freshness, dependency resolution, and relationship to composer.json are not inspected.
    references: []
  - id: CONTROL-SUPPLY-RUBY-RAILS-GEMFILE-LOCK-001
    version: "0.1.0"
    title: Conventional Rails root Gemfile lockfile presence check
    capability_id: control.native.ruby-rails-gemfile-lock
    implementation_id: SEC-RUBY-RAILS-GEMFILE-LOCK-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Root unindented literal gem 'rails' or gem "rails" declaration plus root-relative config/application.rb, checked only for root Gemfile.lock presence.
    exclusions:
      - Indented or conditional declarations, parenthesized/dynamic calls, groups, sources, gemspecs, libraries, nested projects, version values, transitive dependencies, vulnerabilities, provenance, Rails configuration, runtime behavior, and target command execution are not covered.
      - Gemfile.lock presence is evidence only; its contents, integrity, freshness, dependency resolution, and relationship to Gemfile are not inspected.
    references: []
  - id: CONTROL-SUPPLY-RUST-CARGO-LOCK-001
    version: "0.1.0"
    title: Conventional Rust binary root Cargo lockfile presence check
    capability_id: control.native.rust-cargo-lock
    implementation_id: SEC-RUST-CARGO-LOCK-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Root Cargo.toml direct non-empty dependencies table plus root-relative src/main.rs conventional binary form, checked only for root Cargo.lock presence.
    exclusions:
      - Libraries, workspaces, src/bin, custom/configured targets, nested projects, dev/build/target-specific dependencies, features, registries, git dependencies, vulnerability status, and target command execution are not covered.
      - Cargo.lock presence is evidence only; its contents, integrity, freshness, dependency resolution, and relationship to Cargo.toml are not inspected.
    references: []
  - id: CONTROL-SUPPLY-PIP-AUDIT-001
    version: "0.1.0"
    title: pip-audit Python dependency adapter
    capability_id: adapter.pip-audit-python
    implementation_id: SEC-DEP-VULN-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Policy-configured isolated audit of declared Python dependency evidence.
    exclusions:
      - This adapter is opt-in and only supported Python dependency evidence is analyzed.
    references:
      - REF-OWASP-CICD
  - id: CONTROL-SUPPLY-SBOM-001
    version: "0.1.0"
    title: SBOM presence check
    capability_id: control.native.release-sbom
    implementation_id: SEC-RELEASE-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Release-policy presence check for a source artifact and declared SBOM evidence.
    exclusions:
      - This control does not generate, validate, or certify SBOM completeness.
    references:
      - REF-SLSA-1-2-TRACKS
  - id: CONTROL-SUPPLY-PROVENANCE-001
    version: "0.1.0"
    title: Offline GitHub provenance verification adapter
    capability_id: adapter.github-attestation-offline
    implementation_id: SEC-PROVENANCE-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Policy-configured offline verification of supplied local artifact and attestation evidence.
    exclusions:
      - This adapter is opt-in and does not create attestations or establish a SLSA level.
    references:
      - REF-SLSA-1-2-TRACKS
  - id: CONTROL-NEXTJS-PUBLIC-ENV-001
    version: "0.1.0"
    title: Next.js sensitive public environment name check
    capability_id: control.native.nextjs-public-env
    implementation_id: SEC-NEXT-ENV-001
    security_domains:
      - DOMAIN-SECRETS-001
    detection_scope: Direct sensitive-looking NEXT_PUBLIC environment variable references in Next.js sources.
    exclusions:
      - Actual values, indirect access, build outputs, and runtime configuration are not covered.
    references: []
  - id: CONTROL-AUTHORIZATION-NEXT-SERVER-ACTION-001
    version: "0.1.0"
    title: Next.js Server Action local guard-marker check
    capability_id: control.native.nextjs-server-action-local-guard
    implementation_id: SEC-NEXT-ACTION-001
    security_domains:
      - DOMAIN-AUTHORIZATION-001
    detection_scope: Named exported async functions in module-level use server files with direct db or prisma mutations before any recognized local guard-marker call.
    exclusions:
      - A local marker does not prove authentication, authorization, ownership, or data-access-layer correctness.
      - Middleware/proxy conventions, matcher behavior, imported delegates, aliases, closures, runtime dataflow, reachability, and route coverage are not inferred.
      - Only direct db or prisma create, delete, update, or upsert calls are considered.
    references: []
  - id: CONTROL-NEXTJS-SESSION-COOKIE-001
    version: "0.1.0"
    title: Next.js explicit unsafe session-cookie option check
    capability_id: control.native.nextjs-session-cookie
    implementation_id: SEC-NEXT-COOKIE-001
    security_domains:
      - DOMAIN-SESSION-SECURITY-001
    detection_scope: Explicit unsafe options on statically named session-like Next.js cookie calls.
    exclusions:
      - Missing options, custom wrappers, computed names, token lifetime, and token generation are not covered.
    references: []
  - id: CONTROL-NEXTJS-CORS-001
    version: "0.1.0"
    title: Next.js credentialed wildcard CORS check
    capability_id: control.native.nextjs-static-cors
    implementation_id: SEC-NEXT-CORS-001
    security_domains:
      - DOMAIN-CORS-001
    detection_scope: Literal credentialed wildcard CORS pairs in static next.config header arrays.
    exclusions:
      - Dynamic headers, reverse proxies, CDNs, and runtime configuration are not covered.
    references: []
  - id: CONTROL-SUPPLY-GO-MODULE-001
    version: "0.1.0"
    title: Go root-module checksum presence check
    capability_id: control.native.go-module-integrity
    implementation_id: SEC-GO-MODULE-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Root go.mod dependency declarations require a root go.sum checksum file.
    exclusions:
      - Nested modules, checksum contents, dependency resolution, and vulnerability status are not covered.
    references: []
  - id: CONTROL-SUPPLY-GO-VULNERABILITY-SNAPSHOT-001
    version: "0.2.0"
    title: Offline Go dependency vulnerability snapshot check
    capability_id: control.native.go-vulnerability-snapshot
    implementation_id: SEC-GO-VULN-001
    security_domains:
      - DOMAIN-SUPPLY-CHAIN-001
    detection_scope: Exact direct root go.mod dependency versions are compared with two packaged reviewed offline advisory boundaries.
    exclusions:
      - This control has two reviewed advisory boundaries and does not query a live vulnerability database.
      - Indirect dependencies, source reachability, replace directives, build tags, private modules, and remediation are not analyzed.
      - No network request, Go tool, scanner, target command, or target code execution is permitted.
    references: []
  - id: CONTROL-TRANSPORT-GO-TLS-001
    version: "0.1.0"
    title: Go direct TLS verification disablement check
    capability_id: control.native.go-tls-verification
    implementation_id: SEC-GO-TLS-001
    security_domains:
      - DOMAIN-TRANSPORT-SECURITY-001
    detection_scope: Direct tls.Config composite literals explicitly setting InsecureSkipVerify to true.
    exclusions:
      - Aliases, computed values, custom verification, non-Go TLS stacks, and runtime behavior are not inferred.
    references: []
  - id: CONTROL-GOSEC-STATIC-ANALYSIS-001
    version: "0.1.0"
    title: Isolated Gosec Go static-analysis adapter
    capability_id: adapter.gosec-go-module
    implementation_id: SEC-GOSEC-001
    security_domains:
      - DOMAIN-INJECTION-001
      - DOMAIN-PATH-TRAVERSAL-001
      - DOMAIN-SSRF-001
    detection_scope: Policy-configured preinstalled Gosec JSON scan with fixed local arguments and normalized redacted findings.
    exclusions:
      - The adapter is opt-in; no installation, AI-fix mode, remote configuration, dependency download, or target-supplied command is permitted.
      - Domain coverage is limited to the upstream Gosec findings emitted by the configured tool version.
    references:
      - REF-OWASP-API-2023
  - id: CONTROL-CONTAINER-IAC-TRIVY-CONFIG-001
    version: "0.1.0"
    title: Isolated Trivy Dockerfile and Terraform configuration adapter
    capability_id: adapter.trivy-config-isolated
    implementation_id: SEC-TRIVY-CONFIG-001
    security_domains:
      - DOMAIN-CONTAINER-SECURITY-001
      - DOMAIN-IAC-SECURITY-001
    detection_scope: Policy-configured preinstalled Trivy configuration scan of an isolated staged copy containing only inventory-included Dockerfile or Containerfile variants and Terraform .tf files, with fixed offline misconfiguration-only arguments and normalized redacted findings.
    exclusions:
      - This adapter is opt-in and reports NOT_APPLICABLE when no eligible staged artifact is present.
      - Container images, Docker Compose, Kubernetes, Helm, CloudFormation, Terraform plans, tfvars, generated or excluded inputs, custom checks, target configuration, and target ignore files are not scanned.
      - Terraform module fetching, cloud state, providers, computed values, runtime behavior, registry access, target code execution, target commands, remediation, and AI functionality are not inferred or performed.
      - Target inline Trivy ignore directives are neutralized; only exact policy-bound Before Deploy waivers can alter the deterministic release decision.
    references: []
  - id: CONTROL-AUTHORIZATION-NEXT-INLINE-SERVER-ACTION-001
    version: "0.1.0"
    title: Next.js inline Server Action local guard-marker check
    capability_id: control.native.nextjs-inline-server-action-local-guard
    implementation_id: SEC-NEXT-INLINE-ACTION-001
    security_domains:
      - DOMAIN-AUTHORIZATION-001
    detection_scope: Named async function declarations nested in a lexical block with inline use server as the first executable statement, direct db/prisma mutation, and no visible preceding local guard marker.
    exclusions:
      - Arrow actions, exported/module-level actions, non-async functions, directives after executable code, aliases, imported delegates, and wrapped data access are not covered.
      - Local guard markers do not prove authentication, authorization, ownership, tenancy, or policy correctness.
      - Middleware/proxy conventions, page-level checks, closures, runtime dataflow, reachability, and route coverage are not inferred.
    references: []
  - id: CONTROL-INJECTION-PYTHON-SQL-SINGLE-ALIAS-001
    version: "0.1.0"
    title: Python SQL single local-name alias check
    capability_id: control.native.python-sql-single-local-alias
    implementation_id: SEC-SAST-SQL-ALIAS-001
    security_domains:
      - DOMAIN-INJECTION-001
    detection_scope: One direct same-scope simple assignment from an already unsafe SQL query name to one alias name, followed by a standalone execute or executemany call whose first argument is that alias.
    exclusions:
      - Alias chains, branches, loops, try/with/match blocks, calls, imports, object attributes, subscripts, tuples, annotations, closures, globals, nonlocals, ORM behavior, parameter binding, reachability, and runtime input provenance are not covered.
      - The control does not alter SEC-SAST-001 direct or single-local-assignment findings.
    references: []
