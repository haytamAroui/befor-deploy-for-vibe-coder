schema_version: 1
controls:
  - id: CONTROL-JWT-PYTHON-SIGNATURE-VERIFY-001
    version: "0.1.0"
    title: Python JWT signature-verification contract
    capability_id: control.native.python-jwt-signature-verification
    implementation_id: SEC-JWT-PYTHON-VERIFY-001
    security_domains:
      - DOMAIN-JWT-SECURITY-001
      - DOMAIN-AUTHENTICATION-001
    detection_scope: Unshadowed direct PyJWT or python-jose decode calls are checked for a literal options mapping that explicitly sets verify_signature to false.
    exclusions:
      - Import aliases, rebound jwt or decode names, wrappers, options variables, alternative JWT libraries, algorithm selection, expiry validation, issuer or audience validation, key management, revocation, storage, and runtime behavior are not inferred.
    references:
      - REF-OWASP-API-2023
