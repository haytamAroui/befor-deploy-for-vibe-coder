[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "before-deploy"
version = "1.0.0"
description = "Deterministic pre-deployment security controls with bounded AI assistance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Preflight Contributors"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/haytamAroui/preflight"
Repository = "https://github.com/haytamAroui/preflight.git"
Issues = "https://github.com/haytamAroui/preflight/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
preflight = "before_deploy.release_entrypoint:main"
preflight-mcp = "before_deploy.mcp_server:main"
before-deploy = "before_deploy.release_entrypoint:main"
before-deploy-mcp = "before_deploy.mcp_server:main"
before-deploy-benchmark-compare = "before_deploy.comparative_benchmark_cli:main"
before-deploy-caller-pilot = "before_deploy.caller_pilot_runner_cli:main"
before-deploy-real-world-validation = "before_deploy.real_world_validation_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"before_deploy.capabilities" = ["manifests/*.yaml"]
"before_deploy.domains" = ["manifests/*.yaml"]
"before_deploy.controls" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
