[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "before-deploy"
version = "0.1.0"
description = "Deterministic pre-deployment security controls with bounded AI assistance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Before Deploy for Vibe Coder contributors"}
]
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
before-deploy = "before_deploy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"before_deploy.capabilities" = ["manifests/*.yaml"]
"before_deploy.domains" = ["manifests/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
