name: Real-World Corpus Provenance Validation

on:
  push:
    branches: [prod/real-world-validation, prod/readiness-luna]
    paths:
      - "fixtures/real-world-validation/**"
      - "src/before_deploy/real_world_validation*.py"
      - ".github/workflows/real-world-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Synchronize locked development environment
        run: uv sync --frozen --all-extras

      # This job validates that the pinned corpus exists and is internally consistent. It does
      # NOT measure exploratory recall: that needs paired static/exploratory run records, and no
      # producer for them exists yet. The release gate reports the shortfall as
      # INSUFFICIENT_REAL_WORLD_RECALL rather than silently treating this job as §3 evidence.
      - name: Validate pinned real-world corpus and manifest
        run: |
          mkdir -p reports/real-world-validation
          uv run before-deploy-real-world-validation \
            --manifest fixtures/real-world-validation/validation.json \
            --repository-root . \
            --format json > reports/real-world-validation/manifest-validation.json
          cat reports/real-world-validation/manifest-validation.json

      - name: Record scope in the run summary
        if: always()
        shell: bash
        run: |
          {
            printf '## Real-world corpus provenance validation\n\n'
            printf 'This job validates corpus provenance only. It does **not** measure\n'
            printf 'exploratory known-defect recall, so it cannot satisfy the §3 release\n'
            printf 'criterion on its own.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain real-world corpus evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: real-world-corpus-validation
          path: reports/real-world-validation/
          if-no-files-found: warn
          retention-days: 90
