name: Release and Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write

# Job-level env, not step-level: a step's `if` can only see workflow/job env, so defining
# PYPI_API_TOKEN here is what makes the publish step reachable. `secrets` cannot be used in `if`
# at all, which is why the token is resolved through env instead.
#
# This workflow gates on deterministic SOFTWARE readiness only. Model-evaluation criteria
# (docs/PRODUCTION_READINESS_CRITERIA.md §1 and §3) measure an external LLM and are produced by
# the Evaluation Lab workflows; they retain gate_effect=NONE and never block a release.
env:
  PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
  SELF_SCAN_POLICY: rules/strict-ci-policy.yaml

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Synchronize locked development environment
        run: uv sync --frozen --all-extras

      # Evidence steps are allowed to fail without stopping the job: the release gate is the single
      # deciding step, and it must be able to report *why* something is missing or failing.
      - name: Produce deterministic full-suite evidence
        continue-on-error: true
        run: |
          mkdir -p reports/release-gate
          uv run pytest --junitxml=reports/release-gate/full-suite-junit.xml

      - name: Produce lint evidence
        continue-on-error: true
        run: |
          mkdir -p reports/release-gate
          # ruff exits non-zero when it finds violations; the JSON is still the evidence, and the
          # gate rejects any non-empty array.
          uv run ruff check --output-format json \
            src tests scripts/validate_review_benchmark_corpus.py \
            > reports/release-gate/lint-report.json

      - name: Produce operational scenario evidence
        continue-on-error: true
        run: |
          uv run pytest --junitxml=reports/release-gate/operational-junit.xml \
            tests/unit/test_production_openai_bridge.py \
            tests/unit/test_caller_bridge_failure_modes.py \
            tests/unit/test_external_adapters.py \
            tests/unit/test_trivy_config_adapter.py \
            tests/unit/test_evidence_graph.py \
            tests/unit/test_advisory_provider.py

      - name: Produce assurance workflow evidence
        continue-on-error: true
        run: |
          uv run pytest --junitxml=reports/release-gate/assurance-junit.xml \
            tests/integration/test_scan_fixtures.py \
            tests/integration/test_nextjs_fixture_scans.py

      - name: Build distributions
        run: uv build

      - name: Produce clean-install smoke evidence
        continue-on-error: true
        run: |
          uv venv --python 3.11 .release-smoke
          uv pip install --python .release-smoke dist/*.whl
          PREFLIGHT_CLEAN_INSTALL=1 \
          PATH="${PWD}/.release-smoke/bin:${PATH}" \
            uv run pytest --junitxml=reports/release-gate/smoke-junit.xml \
              tests/integration/test_clean_install_smoke.py

      - name: Produce deterministic self-scan evidence
        continue-on-error: true
        run: |
          mkdir -p reports/release-gate/self-scan
          uv run before-deploy scan . \
            --policy "${SELF_SCAN_POLICY}" \
            --output-dir reports/release-gate/self-scan

      - name: Enforce software release readiness before release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/release-gate
          uv run before-deploy-readiness-gate \
            --full-suite-report reports/release-gate/full-suite-junit.xml \
            --lint-report reports/release-gate/lint-report.json \
            --self-scan-report reports/release-gate/self-scan/report.json \
            --operational-report reports/release-gate/operational-junit.xml \
            --assurance-report reports/release-gate/assurance-junit.xml \
            --smoke-report reports/release-gate/smoke-junit.xml \
            --distribution-dir dist \
            --output-dir reports/release-gate

      - name: Record model-evaluation scope in the run summary
        if: always()
        shell: bash
        run: |
          {
            printf '## Model evaluation (informational)\n\n'
            printf 'Criteria §1 (repeated blinded benchmark) and §3 (independent real-world\n'
            printf 'validation) measure an external model, not this software. They keep\n'
            printf '`gate_effect=NONE` and are produced by the Evaluation Lab workflows\n'
            printf '(`production-readiness-luna.yml`, `real-world-validation.yml`).\n'
            printf 'See their run summaries; they do not gate this release.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain release-gate evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-gate
          path: reports/release-gate/
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c603a5a024e4173a # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish package distributions to PyPI
        if: env.PYPI_API_TOKEN != ''
        run: |
          uv publish --token "${PYPI_API_TOKEN}"
