name: Evaluation Lab - Repeated Blinded Model Benchmark

on:
  push:
    branches: [prod/readiness-luna]
    paths:
      - ".github/workflows/production-readiness-luna.yml"
      - "scripts/openai_caller_pilot_bridge.py"
      - "src/before_deploy/caller_experiment.py"
      - "src/before_deploy/caller_pilot.py"
      - "src/before_deploy/caller_pilot_runner.py"
      - "src/before_deploy/caller_pilot_runner_cli.py"
      - "fixtures/caller-pilot-v2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-luna
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_REASONING_EFFORT: medium
      CALLER_PILOT_CASES_PATH: fixtures/caller-pilot-v2/cases.json
    steps:
      - name: Require external model credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.OPENAI_API_TOKEN || secrets.OPENAI_TOKEN || secrets.OPENAI_SECRET_KEY || secrets.OPENAI_API_SECRET || secrets.OPENAI }}
        shell: bash
        run: |
          if [[ -z "${OPENAI_API_KEY}" ]]; then
            echo "No supported OpenAI Actions secret alias resolved." >&2
            exit 1
          fi
          echo "External OpenAI credential detected; production benchmark will run with ${OPENAI_MODEL}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Synchronize locked development environment
        run: uv sync --frozen --all-extras

      - name: Validate benchmark implementation
        run: |
          uv run ruff check scripts/openai_caller_pilot_bridge.py src/before_deploy/caller_experiment.py src/before_deploy/caller_pilot.py src/before_deploy/caller_pilot_runner.py src/before_deploy/caller_pilot_runner_cli.py tests/unit/test_openai_caller_pilot_bridge.py tests/unit/test_caller_pilot.py tests/unit/test_caller_pilot_runner.py tests/unit/test_caller_pilot_v2.py
          uv run pytest -q tests/unit/test_openai_caller_pilot_bridge.py tests/unit/test_caller_pilot.py tests/unit/test_caller_pilot_runner.py tests/unit/test_caller_pilot_v2.py

      - name: Run five-repetition blinded expanded benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY || secrets.OPENAI_API_TOKEN || secrets.OPENAI_TOKEN || secrets.OPENAI_SECRET_KEY || secrets.OPENAI_API_SECRET || secrets.OPENAI }}
        run: >-
          uv run before-deploy-caller-pilot
          --cases fixtures/caller-pilot-v2/cases.json
          --corpus fixtures/caller-pilot-v2/corpus.json
          --output-dir reports/production-readiness-luna
          --provider openai
          --model "${OPENAI_MODEL}"
          --bridge-command-json '["python","scripts/openai_caller_pilot_bridge.py"]'
          --repetitions 5
          --timeout-seconds 120

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          {
            printf '## Model evaluation (informational)\n\n'
            printf 'This run measures `%s`, not the Preflight software. Its result\n' "${OPENAI_MODEL}"
            printf 'keeps `gate_effect=NONE` and does not gate any release.\n'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f reports/production-readiness-luna/caller-pilot.md ]]; then
            cat reports/production-readiness-luna/caller-pilot.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f reports/production-readiness-luna/comparative-benchmark.md ]]; then
            printf '\n## Comparative benchmark\n\n' >> "${GITHUB_STEP_SUMMARY}"
            cat reports/production-readiness-luna/comparative-benchmark.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Retain production-readiness evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: production-readiness-luna
          path: reports/production-readiness-luna/
          if-no-files-found: warn
          retention-days: 90
