name: Deterministic Security Gate CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Synchronize locked development environment
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run ruff check src tests
      - name: Run tests
        run: uv run pytest
      - name: Run deterministic self-scan
        run: uv run before-deploy scan . --policy rules/strict-ci-policy.yaml --output-dir reports
      - name: Retain redacted reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: before-deploy-reports
          path: reports/
          if-no-files-found: error
