name: Caller Pilot Live OpenAI
# Experiment rerun marker: 2026-09-15

on:
  push:
    branches: [feat/agent-specialists-critic]
    paths:
      - ".github/workflows/caller-pilot-openai.yml"
      - "scripts/openai_caller_pilot_bridge.py"
      - "src/before_deploy/caller_experiment.py"
      - "src/before_deploy/caller_pilot.py"
      - "src/before_deploy/caller_pilot_runner.py"
      - "src/before_deploy/caller_pilot_runner_cli.py"
      - "fixtures/caller-pilot-v1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: medium
    steps:
      - name: Detect external model credential
        id: credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [[ -n "${OPENAI_API_KEY}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "External OpenAI credential detected; running blinded pilot." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "OPENAI_API_KEY is not configured; live pilot was not executed." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Check out source
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.credential.outputs.available == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up uv
        if: steps.credential.outputs.available == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Synchronize locked development environment
        if: steps.credential.outputs.available == 'true'
        run: uv sync --frozen --all-extras

      - name: Validate experiment bridge
        if: steps.credential.outputs.available == 'true'
        run: >-
          uv run ruff check
          scripts/openai_caller_pilot_bridge.py
          tests/unit/test_openai_caller_pilot_bridge.py

      - name: Run blinded static vs find_callers pilot
        if: steps.credential.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run before-deploy-caller-pilot
          --cases fixtures/caller-pilot-v1/cases.json
          --corpus fixtures/caller-pilot-v1/corpus.json
          --output-dir reports/caller-pilot-live
          --provider openai
          --model "${OPENAI_MODEL}"
          --bridge-command-json '["python","scripts/openai_caller_pilot_bridge.py"]'
          --repetitions 1
          --timeout-seconds 120

      - name: Publish decision summary
        if: steps.credential.outputs.available == 'true' && always()
        shell: bash
        run: |
          if [[ -f reports/caller-pilot-live/caller-pilot.md ]]; then
            cat reports/caller-pilot-live/caller-pilot.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Retain gate-neutral pilot artifacts
        if: steps.credential.outputs.available == 'true' && always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: caller-pilot-live-openai
          path: reports/caller-pilot-live/
          if-no-files-found: warn
