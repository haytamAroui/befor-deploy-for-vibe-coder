name: External scanner calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    name: Calibrate pinned Gitleaks and Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Gitleaks release with checksum verification
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "/tmp/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "/tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp gitleaks
          install --mode 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install pinned Semgrep
        run: |
          set -euo pipefail
          uv tool install "semgrep==1.175.0"
          "$HOME/.local/bin/semgrep" --version | grep --fixed-strings "1.175.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Synchronize locked Before Deploy environment
        run: uv sync --frozen --all-extras
      - name: Run calibrated external scanner profile
        run: >-
          uv run before-deploy scan .
          --policy rules/external-adapters-policy.yaml
          --output-dir reports/external-calibration
      - name: Retain redacted calibration reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: external-scanner-calibration-reports
          path: reports/external-calibration/
          if-no-files-found: error
          retention-days: 14
