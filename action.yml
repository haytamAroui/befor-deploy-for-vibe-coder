name: 'Preflight Security Scan'
description: 'Deterministic pre-deployment security scan with bounded AI assistance'
author: 'Preflight Contributors'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  repository:
    description: 'Path to the repository or directory to scan'
    required: false
    default: '.'
  policy:
    description: 'Path to policy file'
    required: false
    default: 'rules/strict-ci-policy.yaml'
  output-dir:
    description: 'Directory where JSON, SARIF, and Markdown reports are generated'
    required: false
    default: 'reports'
  python-version:
    description: 'Python version'
    required: false
    default: '3.11'

outputs:
  report-json:
    description: 'Path to the generated JSON report'
    value: '${{ inputs.output-dir }}/report.json'
  report-sarif:
    description: 'Path to the generated SARIF report'
    value: '${{ inputs.output-dir }}/report.sarif'
  report-md:
    description: 'Path to the generated Markdown report'
    value: '${{ inputs.output-dir }}/report.md'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Preflight
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.action_path }}"

    - name: Execute Preflight scan
      shell: bash
      run: |
        preflight scan "${{ inputs.repository }}" \
          --policy "${{ inputs.policy }}" \
          --output-dir "${{ inputs.output-dir }}"
